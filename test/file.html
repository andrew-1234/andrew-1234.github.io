<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Card Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .project-card {
      background-color: #2c2c2c;
      border-radius: 8px;
      padding: 20px;
      color: white;
      width: 400px;
      display: flex;
      flex-direction: column;
    }

    .project-title {
      color: #4caf50;
      margin-bottom: 5px;
    }

    .project-description {
      margin-bottom: 15px;
    }

    .card-content {
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 20px;
    }

    .tech-stack {
      flex-grow: 1;
    }

    .tech-item {
      margin-bottom: 5px;
    }

    .tech-name {
      color: #4caf50;
    }

    .author-info {
      display: flex;
      align-items: center;
      color: silver;
    }

    .author-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      margin-left: 10px;
      overflow: hidden;
    }

    .author-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <div class="project-card">
    <div class="card-content">
      <h2 class="project-title">Boj job</h2>
      <p class="project-description">Easy job searching tool</p>
    </div>
    <div class="card-footer">
      <div class="tech-stack">
        <div class="tech-item">
          <span class="tech-name">JavaScript:</span>
          <span class="tech-percentage">43.86%</span>
        </div>
        <div class="tech-item">
          <span class="tech-name">CSS:</span>
          <span class="tech-percentage">29.00%</span>
        </div>
        <div class="tech-item">
          <span class="tech-name">HTML:</span>
          <span class="tech-percentage">27.15%</span>
        </div>
      </div>
      <div class="author-info">
        <span class="author-name">andrew-1234</span>
        <div class="author-avatar">
          <img src="./DALL-E_a-fox-eating-noodles-in-blade-runner-1982.png" alt="Author avatar">
        </div>
      </div>
    </div>
  </div>
</body>

</html>
